name: OpenFab CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_validation:
        description: Run the optional full test and authoring suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: openfab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public-release
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: openfab-builder-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Full validation is available on request; it does not gate Builder publication.
  # Pages publication continues through the existing gh-pages branch.
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:core
      - run: pnpm test -- --run
      - run: pnpm build
      - name: Install Korean fonts for browser evidence
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          test -n "$(fc-list :lang=ko family)"
      - run: pnpm test:live-demo
      - run: pnpm test:project-save-cancellation
      - run: pnpm lint
      - run: pnpm check:release-identity
      - run: pnpm check:dependency-licenses
      - run: pnpm check:fixture-provenance
      - run: pnpm check:public-safety

  authoring:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The clean export runs the complete authoring journey, bundle audit, and production smoke.
      - name: Install Korean fonts for browser evidence
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          test -n "$(fc-list :lang=ko family)"
      - run: pnpm check:public-export
        env:
          OPENFAB_PUBLIC_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/openfab-public-export-evidence
          OPENFAB_BAY_FLOW_PAINT_TRACE: "1"
      - name: Preserve authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfab-authoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfab-public-export-evidence
          if-no-files-found: warn
          retention-days: 7
