name: OpenFab CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openfab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:core
      - run: pnpm test -- --run
      - run: pnpm build
      - run: pnpm test:live-demo
      - run: pnpm lint
      - run: pnpm check:release-identity
      - run: pnpm check:dependency-licenses
      - run: pnpm check:fixture-provenance
      - run: pnpm check:public-safety

  authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The clean export runs the complete authoring journey, bundle audit, and production smoke.
      - run: pnpm check:public-export
        env:
          OPENFAB_PUBLIC_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/openfab-public-export-evidence
          OPENFAB_BAY_FLOW_PAINT_TRACE: "1"
      - name: Preserve authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfab-authoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openfab-public-export-evidence
          if-no-files-found: warn
          retention-days: 7
